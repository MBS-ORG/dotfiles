name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh bash stow ripgrep shellcheck python3

      - name: Run validation
        run: ./scripts/validate.sh

      - name: Upload results
        if: always()
        run: echo "Validation complete — exit code ${{ job.status }}"
