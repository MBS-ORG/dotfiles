name: Deploy Smoke Test

on:
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: '0 0 1 * *'  # monthly: verify deploy scripts still work

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU Stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Validate stow.sh (dry-run)
        run: |
          bash -n scripts/stow.sh
          echo "stow.sh syntax OK"
          mkdir -p /tmp/stow-target
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            stow --simulate --target="/tmp/stow-target" --dir=packages "$name"
          done

      - name: Validate install.sh (dry-run)
        run: |
          bash -n install.sh
          echo "install.sh syntax OK"

      - name: Validate install-tools.sh
        run: |
          bash -n scripts/install-tools.sh
          echo "install-tools.sh syntax OK"

      - name: Print deploy command for reference
        run: |
          echo "═══ Deploy to a new machine ═══"
          echo "git clone git@github.com:Sabir-test/dotfiles.git ~/.config/dotfiles"
          echo "cd ~/.config/dotfiles"
          echo "./install.sh"
